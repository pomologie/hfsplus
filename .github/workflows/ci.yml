name: Filesystem format verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hosted:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - if: runner.os == 'Linux'
        run: |
          python3 -B tools/test_check_rust_roots.py
          python3 tools/check_rust_roots.py
          python3 -B tools/test_check_kernel_graph.py
          python3 -B tools/test_check_release_evidence.py
          python3 -B tools/test_hfsplus_name_evidence.py
      - run: cargo install --locked cargo-nextest --version '=0.9.151'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo nextest run --locked --workspace --no-default-features
      - run: cargo nextest run --locked -p hfsplus-reader --no-default-features --features decmpfs-zlib --test decmpfs
      - run: cargo test --locked --doc --workspace --no-default-features
      - name: Check the canonical raw HFS+ image digest
        if: runner.os != 'macOS'
        run: python crates/filesystem/hfsplus-builder/verification/check-canonical-volume.py
      - name: Check the canonical raw image with native and independent readers
        if: runner.os == 'macOS'
        run: |
          brew install p7zip
          env -u TMPDIR python3 crates/filesystem/hfsplus-builder/verification/check-canonical-volume.py --seven-zip 7z --native-fsck
      - name: Check fresh allocation across native volume sizes
        if: runner.os == 'macOS'
        run: env -u TMPDIR python3 -B crates/filesystem/hfsplus-builder/verification/check-allocation-layouts.py
      - name: Check mounted HFS+ name lookup and ordering
        if: runner.os == 'macOS'
        run: env -u TMPDIR python3 -B crates/foundation/hfsplus-pomologie-core/tools/capture_kernel_names.py --check
      - name: Check interleaved data and resource forks with native and independent readers
        if: runner.os == 'macOS'
        run: env -u TMPDIR python3 -B crates/filesystem/hfsplus-builder/verification/check-canonical-volume.py --interleaved-forks --native-fsck
      - name: Check native timestamp boundaries
        if: runner.os == 'macOS'
        run: env -u TMPDIR python3 -B crates/filesystem/hfsplus-builder/verification/check-canonical-volume.py --metadata-dates

  bare-metal:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [hfsplus-pomologie-core, hfsplus-format, hfsplus-reader]
        target: [aarch64-unknown-none, x86_64-unknown-none]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo check --locked -p ${{ matrix.package }} --no-default-features --target ${{ matrix.target }}
      - run: cargo build --locked -p ${{ matrix.package }} --no-default-features --target ${{ matrix.target }}
      - name: Enforce the standalone target dependency boundary
        run: python3 -B tools/check_kernel_graph.py --package ${{ matrix.package }} --target ${{ matrix.target }}

  placement-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: cargo install --locked kani-verifier --version '=0.68.0'
      - run: cargo kani setup
      - run: bash crates/filesystem/hfsplus-builder/verification/check.sh
      - run: bash crates/formats/hfsplus-format/verification/check.sh
      - run: bash crates/formats/hfsplus-format/verification/check-btree-offsets.sh
