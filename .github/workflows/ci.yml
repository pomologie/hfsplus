name: Filesystem format verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hosted:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo install --locked cargo-nextest --version '=0.9.151'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo nextest run --locked --workspace --no-default-features
      - run: cargo test --locked --doc --workspace --no-default-features

  bare-metal:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [hfsplus-core, hfsplus-format, hfsplus-reader]
        target: [aarch64-unknown-none, x86_64-unknown-none]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo check --locked -p ${{ matrix.package }} --no-default-features --target ${{ matrix.target }}
      - run: cargo build --locked -p ${{ matrix.package }} --no-default-features --target ${{ matrix.target }}
      - name: Enforce the standalone target dependency boundary
        env:
          FS_PACKAGE: ${{ matrix.package }}
          FS_TARGET: ${{ matrix.target }}
        run: |
          tree=$(cargo tree --locked -p "$FS_PACKAGE" --no-default-features --target "$FS_TARGET" -e normal --prefix none --format '{p}')
          actual=$(awk '{print $1}' <<< "$tree" | LC_ALL=C sort -u)
          expected="$FS_PACKAGE"
          if [[ "$FS_PACKAGE" == hfsplus-reader ]]; then
            expected=$(printf '%s\n' hfsplus-core hfsplus-format hfsplus-reader)
          fi
          test "$actual" = "$expected"

  placement-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: cargo install --locked kani-verifier --version '=0.68.0'
      - run: cargo kani setup
      - run: bash crates/filesystem/hfsplus-builder/verification/check.sh
