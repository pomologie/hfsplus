[workspace]
resolver = "3"
members = [
	# Filesystem
	"crates/filesystem/hfsplus-builder",
	"crates/filesystem/hfsplus-reader",

	# Formats
	"crates/formats/hfsplus-format",

	# Foundation
	"crates/foundation/hfsplus-pomologie-core",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/pomologie/hfsplus"

[workspace.dependencies]
# Workspace filesystem
hfsplus-reader = { version = "0.1.0", path = "crates/filesystem/hfsplus-reader", default-features = false }

# Workspace formats
hfsplus-format = { version = "0.1.0", path = "crates/formats/hfsplus-format", default-features = false }

# Workspace foundation
hfsplus-core = { package = "hfsplus-pomologie-core", version = "0.1.0", path = "crates/foundation/hfsplus-pomologie-core", default-features = false }

# Compression
miniz_oxide = { version = "=0.9.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
