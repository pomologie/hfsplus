[package]
name = "hfsplus-reader-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# Workspace filesystem reader and positioned I/O contract
hfsplus-reader = { path = "../..", default-features = false }
hfsplus-core = { package = "hfsplus-pomologie-core", path = "../../../../foundation/hfsplus-pomologie-core" }

# Hosted verification
libfuzzer-sys = "=0.4.13"

[workspace]
resolver = "3"

[[bin]]
name = "fork_windows"
path = "fuzz_targets/fork_windows.rs"
test = false
doc = false
bench = false
